[dependencies]
numpy = "*"
openssl = ">=3, <3.6"
uv = ">=0.4"
libstdcxx = ">=3.4,<=15.1"
libstdcxx-ng = ">=3.4,<=15.1"
scipy = "*"

    [dependencies.python]
    version = ">=3.10, <3.13, >=3.10,!=3.14.0,!=3.14.1,<4"
    build = "*cp*"
    channel = "conda-forge"

    [dependencies.libpython]
    version = "*"
    channel = "conda-forge"

[pypi-dependencies]
sinter = ">=1.14"
stim = ">=1.14"
fusion-blossom = ">=0.2.13"
mwpf = ">=0.2.6"
pymatching = "*"
ldpc = ">=2.2.8"
panqec = ">=0.1.7"

[workspace]
name = ".CondaPkg"
description = "automatically generated by CondaPkg.jl"
platforms = ["linux-64"]
channel-priority = "strict"
channels = ["conda-forge"]
